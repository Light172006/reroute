[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reroute-agents"
version = "0.1.0"
description = "Agentic travel planning, monitoring, and replanning system for Reroute"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain==1.5.2",
    "langchain-core==1.8.4",
    "langgraph==1.2.24",
    "langgraph-checkpoint==4.3.2",
    "langchain-google-genai==4.5.2",
    "langchain-groq==1.2.1",
    "pydantic==2.14.0",
    "httpx==0.28.1",
    "tenacity==9.1.4",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
postgres = [
    "langgraph-checkpoint-postgres==3.2.1",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "hypothesis==6.170.16",
    "ruff==0.17.6",
    "mypy==2.4.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["reroute_agents*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP", "S110"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
