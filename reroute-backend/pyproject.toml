[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reroute-backend"
version = "0.1.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "langchain>=0.3.7",
    "langgraph>=0.2.39",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "python-multipart>=0.0.17",
    "httpx>=0.27.2",
    "sse-starlette>=2.1.3",
    "tenacity>=9.0.0",
    "pyjwt>=2.9.0"
]

[tool.setuptools]
packages = ["app"]
